name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e "ml[train,dev]"
      - run: pytest -q ml/tests

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            apps/api/pyproject.toml
      - run: pip install -e ml -e "apps/api[dev]"
      - name: Pytest (in-memory SQLite, real model artifacts)
        working-directory: apps/api
        run: pytest -q
      - name: Note-extraction eval integrity (frozen v1 rules, untouched holdout)
        working-directory: apps/api
        run: sha256sum -c eval/.rules_frozen.sha256

  migrations:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pht
          POSTGRES_PASSWORD: pht
          POSTGRES_DB: pht
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pht -d pht" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pht:pht@localhost:5432/pht
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            apps/api/pyproject.toml
      - run: pip install -e ml -e apps/api
      - name: Upgrade, check models match migrations, round-trip, seed
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m app.seed --patients 12

  web:
    name: Web lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [api, migrations, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Postgres + API + web
        run: docker compose up -d --build
      - name: Seed demo data
        run: docker compose run --rm api python -m app.seed --patients 30
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
